/* ==================================================

/* ==================================================

================================================== */

const map =
    document.getElementById("map");

const container =
    document.getElementById("mapContainer");


let zoom = 1;

let positionX = 0;

let positionY = 0;

let dragging = false;

let pointerStartX = 0;

let pointerStartY = 0;

let originalX = 0;

let originalY = 0;


/* ==================================================
ATUALIZAR MAPA
================================================== */

function updateMap(){

    map.style.transform =
        `translate(
            calc(-50% + ${positionX}px),
            calc(-50% + ${positionY}px)
        )
        scale(${zoom})`;

}


/* ==================================================
ZOOM
================================================== */

function zoomIn(){

    zoom += 0.2;

    if(zoom > 3){

        zoom = 3;

    }

    updateMap();

}


function zoomOut(){

    zoom -= 0.2;

    if(zoom < 0.6){

        zoom = 0.6;

    }

    updateMap();

}


function resetMap(){

    zoom = 1;

    positionX = 0;

    positionY = 0;

    updateMap();

}


/* ==================================================
ARRASTAR MAPA

USANDO POINTER EVENTS

Isso funciona com:

- mouse
- touch
- caneta
================================================== */

container.addEventListener(
    "pointerdown",
    function(event){

        /*
        Se clicou em uma Casa,
        não arrasta o mapa.
        */

        if(
            event.target.closest(".marker")
        ){

            return;

        }


        dragging = true;


        container.classList.add(
            "dragging"
        );


        pointerStartX =
            event.clientX;

        pointerStartY =
            event.clientY;


        originalX =
            positionX;

        originalY =
            positionY;


        /*
        Mantém o mesmo ponteiro
        durante o arrasto.
        */

        try{

            container.setPointerCapture(
                event.pointerId
            );

        }catch(error){}

    }
);


container.addEventListener(
    "pointermove",
    function(event){

        if(!dragging){

            return;

        }


        const differenceX =
            event.clientX - pointerStartX;

        const differenceY =
            event.clientY - pointerStartY;


        positionX =
            originalX + differenceX;

        positionY =
            originalY + differenceY;


        updateMap();

    }
);


function pararArrasto(){

    dragging = false;

    container.classList.remove(
        "dragging"
    );

}


container.addEventListener(
    "pointerup",
    pararArrasto
);


container.addEventListener(
    "pointercancel",
    pararArrasto
);


container.addEventListener(
    "pointerleave",
    function(event){

        /*
        Não interrompe o arrasto
        simplesmente porque o mouse
        saiu da área.
        */

        if(
            event.pointerType === "mouse"
        ){

            return;

        }

    }
);


/* ==================================================

================================================== */

document

/* ==================================================
ABRIR CASA
================================================== */

async function abrirCasa(id){

    const info =
        document.getElementById("info");

    const content =
        document.getElementById("infoContent");


    info.classList.add("active");


    content.innerHTML = `

        <div class="house-symbol">
            ⏳
        </div>

        <h2>
            Carregando...
        </h2>

        <p>
            Buscando informações da Casa.
        </p>

    `;


    /*
    Primeiro tenta Supabase.
    */


    try{

        const result =
            await supabaseClient
                .from("casas")
                .select("*")
                .eq("slug",id)
                .maybeSingle();


        const data =
            result.data;


        const error =
            result.error;


        if(
            !error &&
            data
        ){

            mostrarDadosCasa(data);

            return;

        }

    }catch(error){

        console.error(
            "Erro Supabase:",
            error
        );

    }


    /*
    Se o Supabase ainda não estiver
    configurado, usa os dados locais.
    */

    const casa =
        casasFallback[id];


    if(!casa){

        content.innerHTML = `

            <h2>
                Casa não encontrada
            </h2>

        `;

        return;

    }


    mostrarDadosCasa(casa);

}


/* ==================================================
MOSTRAR DADOS
================================================== */

function mostrarDadosCasa(data){

    const content =
        document.getElementById("infoContent");


    content.innerHTML = `

        <div class="house-symbol">
            ${data.simbolo || "🏰"}
        </div>

        <h2>
            ${data.nome || "Casa"}
        </h2>

        <p>
            <strong>Região:</strong><br>
            ${data.regiao || "Não informado"}
        </p>

        <p>
            <strong>Sede:</strong><br>
            ${data.sede || "Não informado"}
        </p>

        <p>
            <strong>Governante:</strong><br>
            ${data.governante || "Não informado"}
        </p>

        <p>
            <strong>Membros:</strong><br>
            ${data.membros_atual ?? 0}
            /
            ${data.membros_maximo ?? 0}
        </p>

        <p class="house-description">
            ${data.descricao || "Nenhuma descrição cadastrada."}
        </p>

        <a
            href="#"
            class="house-button"
            onclick="return false;">
            VER CASA
        </a>

    `;

}


/* ==================================================
FECHAR CASA
================================================== */

function fecharInfo(){

    document
        .getElementById("info")
        .classList.remove("active");

}


/* ==================================================
ERRO MAPA
================================================== */

function mostrarErroMapa(){

    document
        .getElementById("mapError")
        .classList.add("active");

}


function fecharErro(){

    document
        .getElementById("mapError")
        .classList.remove("active");

}

/*
Testa se o Supabase está acessível,
mas não impede o mapa de funcionar
caso a tabela ainda não esteja criada.
*/

async function testarSupabase(){

    try{

        const result =
            await supabaseClient
                .from("casas")
                .select("slug")
                .limit(1);


        if(result.error){

            console.warn(
                "Supabase ainda não está pronto:",
                result.error.message
            );

            return;

        }


        console.log(
            "Supabase conectado!"
        );

    }catch(error){

        console.warn(
            "Supabase indisponível."
        );

    }

}

testarSupabase();
