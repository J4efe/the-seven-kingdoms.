<script>

/* ==================================================
SUPABASE
================================================== */

const SUPABASE_URL =
    "https://kdxvibhziscmdmppufku.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OF5ZtHAY4f90jY3wPir33Q_Dy2w2_dq";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* ==================================================
MAPA
================================================== */

let zoom = 1;

const map =
    document.getElementById("map");

const container =
    document.getElementById("mapContainer");

let positionX = 0;
let positionY = 0;

let dragging = false;

let startX = 0;
let startY = 0;

/* ==================================================
ATUALIZAR MAPA
================================================== */

function updateMap(){

    map.style.transform =
        `translate(
            calc(-50% + ${positionX}px),
            calc(-50% + ${positionY}px)
        )
        scale(${zoom})`;

}

/* ==================================================
ZOOM
================================================== */

function zoomIn(){

    zoom += 0.2;

    if(zoom > 3){
        zoom = 3;
    }

    updateMap();

}

function zoomOut(){

    zoom -= 0.2;

    if(zoom < 0.7){
        zoom = 0.7;
    }

    updateMap();

}

function resetMap(){

    zoom = 1;

    positionX = 0;
    positionY = 0;

    updateMap();

}

/* ==================================================
ARRASTAR MAPA
================================================== */

container.addEventListener(
    "mousedown",
    function(e){

        if(
            e.target.classList.contains("marker")
        ){
            return;
        }

        dragging = true;

        startX =
            e.clientX - positionX;

        startY =
            e.clientY - positionY;

    }
);

window.addEventListener(
    "mouseup",
    function(){

        dragging = false;

    }
);

window.addEventListener(
    "mousemove",
    function(e){

        if(!dragging){
            return;
        }

        positionX =
            e.clientX - startX;

        positionY =
            e.clientY - startY;

        updateMap();

    }
);

/* ==================================================
SUPABASE — CASA
================================================== */

async function mostrarCasa(id){

    const info =
        document.getElementById("info");

    const content =
        document.getElementById("infoContent");

    content.innerHTML = `

        <div class="house-symbol">
            ⏳
        </div>

        <h2>
            Carregando...
        </h2>

        <p>
            Buscando informações da Casa.
        </p>

    `;

    info.classList.add("active");

    const { data, error } =
        await supabaseClient
            .from("casas")
            .select("*")
            .eq("slug", id)
            .single();

    if(error){

        console.error(
            "Erro Supabase:",
            error
        );

        content.innerHTML = `

            <div class="house-symbol">
                ⚠️
            </div>

            <h2>
                Casa não encontrada
            </h2>

            <p>
                Não foi possível carregar os
                dados desta Casa.
            </p>

            <p>
                Verifique se a tabela
                <strong>casas</strong>
                existe no Supabase.
            </p>

        `;

        return;

    }

    content.innerHTML = `

        <div class="house-symbol">
            ${data.simbolo || "🏰"}
        </div>

        <h2>
            ${data.nome || "Casa"}
        </h2>

        <p>
            <strong>Região:</strong><br>
            ${data.regiao || "Não informado"}
        </p>

        <p>
            <strong>Sede:</strong><br>
            ${data.sede || "Não informado"}
        </p>

        <p>
            <strong>Governante:</strong><br>
            ${data.governante || "Não informado"}
        </p>

        <p>
            <strong>Membros:</strong><br>
            ${data.membros_atual || 0}/${data.membros_maximo || 0}
        </p>

        <p class="house-description">
            ${data.descricao || "Nenhuma descrição cadastrada."}
        </p>

    `;

}

/* ==================================================
FECHAR PAINEL
================================================== */

function fecharInfo(){

    document
        .getElementById("info")
        .classList.remove("active");

}

/* ==================================================
ERRO DO MAPA
================================================== */

const imagemMapa =
    document.getElementById("westerosMap");

imagemMapa.addEventListener(
    "error",
    function(){

        console.error(
            "ERRO: Westeros_map.png não foi encontrado."
        );

        document
            .getElementById("errorMessage")
            .style.display = "block";

    }
);

imagemMapa.addEventListener(
    "load",
    function(){

        console.log(
            "Westeros_map.png carregado com sucesso!"
        );

    }
);

function fecharErro(){

    document
        .getElementById("errorMessage")
        .style.display = "none";

}

/* ==================================================
TESTAR SUPABASE
================================================== */

async function testarSupabase(){

    console.log(
        "Conectando ao Supabase..."
    );

    const { data, error } =
        await supabaseClient
            .from("casas")
            .select("slug")
            .limit(1);

    if(error){

        console.error(
            "Erro Supabase:",
            error
        );

        return;

    }

    console.log(
        "Supabase conectado com sucesso!",
        data
    );

}

/* ==================================================
INICIALIZAÇÃO
================================================== */

testarSupabase();

updateMap();

</script>
